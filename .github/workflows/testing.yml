name: Testing

on:
  pull_request:
    branches:
      - main

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.16
    with:
      license_header_check_project_name: "project"
      format_check_enabled: true
      broken_symlink_check_enabled: true
      unacceptable_language_check_enabled: true
      shell_check_enabled: true
      docs_check_enabled: false
      api_breakage_check_enabled: false
      license_header_check_enabled: false
      yamllint_check_enabled: false
      python_lint_check_enabled: false

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.16
    with:
      enable_windows_checks: false
      linux_build_command: "swift test --parallel --enable-code-coverage"
      linux_swift_versions: '["6.3", "6.4"]'
